[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-tied-qnbp"
version = "1.0.0"
description = "Orbit-Tied Quantized Neural Belief Propagation for Sliding-Window Decoding of Bivariate-Bicycle Quantum Codes"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "Md. Nazmul", email = "nazmulhas36@gmail.com" },
    { name = "Musrat Jahan Gungun", email = "gungunjahan84@gmail.com" },
    { name = "Maheli Ahmed", email = "maheli.ahmed.cse.cot@gmail.com" }
]
maintainers = [
    { name = "Md. Nazmul", email = "nazmulhas36@gmail.com" }
]
keywords = [
    "quantum-computing",
    "quantum-error-correction",
    "qldpc",
    "bivariate-bicycle-codes",
    "neural-belief-propagation",
    "sliding-window-decoding",
    "fpga-hardware",
    "canonical-signed-digit",
    "stim"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "torch>=2.0.0",
    "stim>=1.12.0",
    "matplotlib>=3.5.0",
    "pymupdf>=1.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]
benchmarks = [
    "ldpc>=0.1.50",
    "sinter>=1.12.0",
]

[project.scripts]
qnbp = "orbit_tied_qnbp.cli:main"

[project.urls]
Homepage = "https://github.com/NazmulHasanNihal/orbit-tied-qnbp-sliding-window-bb"
Documentation = "https://github.com/NazmulHasanNihal/orbit-tied-qnbp-sliding-window-bb#readme"
Repository = "https://github.com/NazmulHasanNihal/orbit-tied-qnbp-sliding-window-bb.git"
"Bug Tracker" = "https://github.com/NazmulHasanNihal/orbit-tied-qnbp-sliding-window-bb/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orbit_tied_qnbp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --import-mode=importlib"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".agent",
    ".git",
    "build",
    "dist",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length
    "E741",  # ambiguous variable name
    "F401",  # unused imports
    "F403",  # star imports
    "F405",  # star import names
    "F841",  # unused variable
    "W291",  # trailing whitespace
    "W292",  # newline at end of file
    "W293",  # blank line contains whitespace
]

