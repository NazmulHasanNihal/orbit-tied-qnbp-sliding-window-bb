name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Verify (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: |
          python -m ruff check src/ tests/

      - name: Run CLI Self-Verification
        run: |
          python -m orbit_tied_qnbp.cli verify

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/ -k "not cosim_10k" -v

      - name: Run Forensic PDF Integrity Audit
        run: |
          python tests/verify_main_pdf.py

  build:
    name: Package Build & Twine Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build Wheel and Source Distribution
        run: |
          python -m build

      - name: Validate Package Metadata with Twine
        run: |
          python -m twine check dist/*

